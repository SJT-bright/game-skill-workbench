name: Release desktop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: mac
          - os: windows-latest
            kind: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Verify real Codex queue in isolated profile
        run: |
          npm install --prefix .qa/codex --no-audit --no-fund @openai/codex@0.158.0
          node scripts/verify-codex-queue.cjs
      - name: Build Mac
        if: matrix.kind == 'mac'
        shell: bash
        env:
          ARCH: arm64
        run: |
          npm run build:mac
          node scripts/build-skill-bundles.cjs
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          ditto -c -k --keepParent "dist/$version/游戏工作台.app" "release/GameDesk-$version-mac-arm64.zip"
      - name: Verify Mac native import and bundle push
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          SKILL_DOCK_DATA_DIR="$PWD/.qa/ci-native" SKILL_DOCK_SMOKE_EMBEDDED=1 SKILL_DOCK_SMOKE_SELECTION=1 SKILL_DOCK_SMOKE_E2E=1 SKILL_DOCK_SMOKE_FIXTURE=1 "dist/$version/游戏工作台.app/Contents/MacOS/GameDeskSkill" --smoke-test --disable-gpu
          node -e "const r=require('./.qa/ci-native/native-e2e.json');if(!r.nativeDrop||r.bundleQueue.length!==2)process.exit(1)"
      - name: Build Windows
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          npm run build:win
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "dist/$version/GameDesk-Skill-$version-win-x64/*" -DestinationPath "release/GameDesk-$version-windows-x64.zip"
      - name: Verify Windows startup with embedded Skill files
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $env:SKILL_DOCK_DATA_DIR = Join-Path $PWD '.qa/ci-native'
          $env:SKILL_DOCK_SMOKE_EMBEDDED = '1'
          $env:SKILL_DOCK_SMOKE_SELECTION = '1'
          $env:SKILL_DOCK_SMOKE_E2E = '1'
          $env:SKILL_DOCK_SMOKE_FIXTURE = '1'
          New-Item -ItemType Directory -Path '.qa/ci-native' -Force | Out-Null
          $exe = Join-Path $PWD "dist/$version/GameDesk-Skill-$version-win-x64/GameDeskSkill.exe"
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test','--disable-gpu') -Wait -PassThru -RedirectStandardOutput '.qa/ci-out.log' -RedirectStandardError '.qa/ci-error.log'
          if($process.ExitCode -ne 0){Get-Content '.qa/ci-error.log' -ErrorAction SilentlyContinue; Get-Content '.qa/ci-native/smoke-error.txt' -ErrorAction SilentlyContinue; throw ('Native Windows smoke failed: '+$process.ExitCode)}
          $report = Get-Content '.qa/ci-native/smoke.json' -Raw | ConvertFrom-Json
          if($report.embeddedCount -lt 15 -or -not $report.api){throw 'Embedded Skill startup verification failed'}
          $e2e = Get-Content '.qa/ci-native/native-e2e.json' -Raw | ConvertFrom-Json
          if(-not $e2e.nativeDrop -or $e2e.bundleQueue.Count -ne 2){throw 'Native import/bundle queue verification failed'}
      - name: Verify Windows published old version to public latest native upgrade
        if: matrix.kind == 'win'
        timeout-minutes: 15
        shell: pwsh
        run: node scripts/verify-windows-upgrade.cjs --published
      - name: Verify Windows native upgrade from published 0.2.14
        if: matrix.kind == 'win'
        timeout-minutes: 15
        shell: pwsh
        env:
          WINDOWS_UPGRADE_BASELINE: 0.2.14
        run: node scripts/verify-windows-upgrade.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.kind }}
          path: release/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-proof-${{ matrix.kind }}
          include-hidden-files: true
          path: |
            .qa/ci-native/*.json
            .qa/ci-native/view-*.png
            .qa/ci-native/smoke-error.txt
            .qa/ci-error.log
            .qa/windows-upgrade-*/upgrade-proof.json
            .qa/windows-upgrade-*/installer-*.json
            .qa/windows-upgrade-*/用户数据/updates/apply.ps1
            .qa/windows-upgrade-*/*.log
            .qa/windows-upgrade-*/用户数据/updates/receipt.json
            .qa/windows-upgrade-*/upgraded-native-stages/*.json
            .qa/windows-upgrade-*/upgraded-native-stages/smoke-error.txt
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish release and verified update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            git fetch origin main --depth=1
            git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ":!skills/**" || { echo "Superseded software revision"; exit 1; }
          fi
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            draft=$(gh release view "v$version" --json isDraft --jq .isDraft)
            [ "$draft" = true ] || { echo "Version is already published; increment package version"; exit 1; }
            gh release edit "v$version" --target "$GITHUB_SHA"
          else
            gh release create "v$version" --draft --target "$GITHUB_SHA" --title "游戏工作台 $version" --notes-file CHANGELOG.md
          fi
          gh release upload "v$version" release/*.zip --clobber
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name==\"v$version\")][0].id")
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release-assets.json
          node scripts/release-manifest.cjs release-assets.json
          gh release upload "v$version" release/gamedesk-update.json --clobber
          gh release edit "v$version" --draft=false --latest
